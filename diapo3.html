<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poesía generativa</title>
<style>
  :root { --bg:#eef3f2; --fg:#12302d; --muted:#4b6663; --line:#c9d8d5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1f1d; --fg:#e4f0ee; --muted:#9bb5b1; --line:#24413e; color-scheme: dark; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: 20px 16px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }
  .caption { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px;
             font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .caption strong { font-weight:600; color:var(--fg); }
  img { display:block; width:100%; height:auto; border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="caption"><strong>Poesía generativa</strong><span>Diapositiva 3 de 4</span></div>
  <img src="diapo3.jpg" alt="Diapositiva 3: Poesía generativa">
</main>
</body>
</html>
